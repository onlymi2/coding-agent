[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ke-agent"
version = "0.1.0"
description = "A small, self-built coding agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "textual>=0.80.0",
  "starlette>=0.38.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ke = "ke.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
